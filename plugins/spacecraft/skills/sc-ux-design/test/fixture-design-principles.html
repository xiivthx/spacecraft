<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design principles calculation fixture</title>
  <!--
    Calculation fixture for check-design-principles.mjs — NOT product UI.
    Persuade/centric demo: primary split near φ (618:382) and symmetric visual
    mass so DCM stays within ±8% of geometric center. Do not ship as app chrome.
  -->
  <style>
    :root {
      --phi-a: 618px;
      --phi-b: 382px;
      --bg: #0e1116;
      --surface: #151a21;
      --text: #f3ead7;
      --muted: #b9ad98;
      --accent: #f6b44b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .frame {
      width: 1000px;
      height: 600px;
      margin: 24px auto;
      display: flex;
      background: var(--surface);
    }
    .primary {
      width: var(--phi-a);
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      border-right: 1px solid #2a3340;
    }
    .primary h1 {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .primary p {
      font-size: 16px;
      line-height: 1.5;
      color: var(--muted);
      max-width: 28ch;
    }
    .cta {
      align-self: flex-start;
      margin-top: 8px;
      padding: 12px 20px;
      background: var(--accent);
      color: #080a0d;
      font-weight: 600;
      font-size: 16px;
      border: 0;
      border-radius: 4px;
    }
    .chrome {
      width: var(--phi-b);
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
    }
    .mass {
      height: 120px;
      background: #1b222b;
      border: 1px solid #2a3340;
    }
    .mass-label {
      font-size: 12px;
      font-family: "IBM Plex Mono", monospace;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="frame">
    <section
      class="primary"
      data-phi-a="618"
      aria-label="Primary content"
    >
      <h1>Centered signal</h1>
      <p>Persuade layout with a golden primary split and balanced visual weight.</p>
      <button type="button" class="cta">Continue</button>
    </section>
    <aside
      class="chrome"
      data-phi-b="382"
      aria-label="Secondary chrome"
    >
      <div class="mass-label">Balance mass A</div>
      <div class="mass" aria-hidden="true"></div>
      <div class="mass-label">Balance mass B</div>
      <div class="mass" aria-hidden="true"></div>
    </aside>
  </div>

  <!-- Visual mass model for DCM (canvas-free). Symmetric weights about frame center. -->
  <script type="application/json" id="dcm-weights">
  {
    "width": 1000,
    "height": 600,
    "rects": [
      { "x": 40, "y": 180, "w": 400, "h": 240, "weight": 1 },
      { "x": 560, "y": 180, "w": 400, "h": 240, "weight": 1 }
    ]
  }
  </script>
</body>
</html>
